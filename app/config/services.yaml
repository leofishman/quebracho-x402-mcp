# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    Quebracho\X402\EvmExact: ~

    # One claim per payment, durable across processes on this host.
    Quebracho\X402\FileClaims:
        arguments: ['%kernel.project_dir%/var/x402-claims']

    # Settlement goes through App\X402\Facilitator: X402_FACILITATOR=mock
    # must be explicit; the testnet facilitator plugs in there on 6–8/11.
    Quebracho\X402\X402McpMiddleware:
        arguments:
            $schemes: ['@Quebracho\X402\EvmExact']
            $price: !closure '@App\X402\Pricing'
            $claim: !closure '@Quebracho\X402\FileClaims'
            $settle: !closure '@App\X402\Facilitator'
            $responses: '@mcp.psr17_factory'
            $streams: '@mcp.psr17_factory'
            # AddressCheck on the payer, answered by App\X402\Screening.
            $events: '@event_dispatcher'

    mcp.server.default.controller:
        class: App\Controller\McpController
        public: true
        autowire: false
        arguments:
            - '@mcp.server.default'
            - '@mcp.psr_http_factory'
            - '@mcp.http_foundation_factory'
            - '@mcp.psr17_factory'
            - '@mcp.psr17_factory'
            - '@mcp.server.default.middleware_factory'
            - '@Quebracho\X402\X402McpMiddleware'
            - '@logger'
        tags: [controller.service_arguments, { name: monolog.logger, channel: mcp }]

    # Buyer side, for app:ask: pays paid tools in band within X402_BUDGET_USD.
    Quebracho\X402\PayingMcpClient:
        arguments:
            $client: '@psr18.http_client'
            $schemes:
                - !service
                    class: Quebracho\X402\EvmExact
                    arguments: [!service { class: Quebracho\X402\Signer, arguments: ['%env(X402_BUYER_KEY)%'] }]
            $budget: !service
                class: Quebracho\X402\Budget
                factory: ['Quebracho\X402\Budget', 'usd']
                # Expired signatures the seller never settled are freed, once the chain says so.
                arguments: ['%env(X402_NETWORK)%', '%env(X402_BUDGET_USD)%', !closure '@App\X402\AuthorizationState']
            $streams: '@mcp.psr17_factory'
            $onPaid: !closure '@App\X402\Receipts'
            # AddressCheck on payTo before signing, answered by App\X402\Screening.
            $events: '@event_dispatcher'
